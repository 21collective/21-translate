<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>21 Translate Ayarları</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px system-ui, "Segoe UI", sans-serif; max-width: 420px; margin: 32px auto; padding: 0 16px; }
  label { display: block; margin: 16px 0 6px; font-weight: 600; }
  select { width: 100%; padding: 6px; font-size: 14px; }
  small { display: block; opacity: .65; margin-top: 4px; }
  #saved { color: #2a9d55; margin-top: 16px; min-height: 1em; }
</style>
</head>
<body>
  <h2>21 Translate</h2>

  <label for="ocrLang">Görseldeki yazının dili (OCR)</label>
  <select id="ocrLang">
    <option value="auto">Otomatik (Latin alfabesi)</option>
    <option value="eng">İngilizce</option>
    <option value="eng+tur">İngilizce + Türkçe</option>
    <option value="deu">Almanca</option>
    <option value="fra">Fransızca</option>
    <option value="spa">İspanyolca</option>
    <option value="ita">İtalyanca</option>
    <option value="rus">Rusça</option>
    <option value="ara">Arapça</option>
    <option value="jpn">Japonca</option>
    <option value="kor">Korece</option>
    <option value="chi_sim">Çince (basitleştirilmiş)</option>
  </select>
  <small>Doğru dili seçmek OCR kalitesini çok etkiler. Her dil ilk kullanımda bir kez indirilir.</small>

  <label for="targetLang">Çevrilecek dil</label>
  <select id="targetLang">
    <option value="tr">Türkçe</option>
    <option value="en">İngilizce</option>
    <option value="de">Almanca</option>
    <option value="fr">Fransızca</option>
    <option value="es">İspanyolca</option>
  </select>

  <div id="saved"></div>
  <script src="options.js"></script>
</body>
</html>
